services:
  postgres:
    image: postgres:17-alpine
    container_name: sniplink-postgres
    environment:
      POSTGRES_USER: chines
      POSTGRES_PASSWORD: chines05
      POSTGRES_DB: sniplink_short_db
    ports:
      - "5433:5432"
    volumes:
      - sniplink-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chines -d sniplink_short_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: sniplink-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - sniplink-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sniplink-postgres-data:
  sniplink-rabbitmq-data:
