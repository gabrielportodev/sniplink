server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API do short-service (environment.prod -> apiUrl '/api').
    location /api/ {
        proxy_pass http://short-service:8082/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API do analytics-service (environment.prod -> analyticsApiUrl '/analytics-api').
    location /analytics-api/ {
        proxy_pass http://analytics-service:8083/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fluxo OAuth2 do short-service (início e callback).
    location /oauth2/ {
        proxy_pass http://short-service:8082/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/oauth2/ {
        proxy_pass http://short-service:8082/login/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: deixa o Angular Router resolver as rotas no client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
